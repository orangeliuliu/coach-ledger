body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 64px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.monthnav{display:flex;align-items:center;gap:6px}

.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.savestate{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}

.savestate.busy i{background:var(--wait)}
.savestate.err i{background:var(--off)}
.savestate.local i{background:var(--muted)}

/* summary */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat .lab{font-size:12px;color:var(--muted);letter-spacing:.04em}
.stat .val{font-family:var(--num);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .val .cur{font-size:16px;font-weight:600;color:var(--muted);margin-right:3px}
.stat .sub{font-size:12px;color:var(--muted)}
.stat.main .val{color:var(--ok)}
.stat.wait .val{color:var(--wait)}
.stat.off .val{color:var(--off)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex;margin-top:6px}
.progress b{display:block;height:100%}

@media (max-width:480px){.stat{padding:12px}.stat .val{font-size:23px}.stat .val .cur{font-size:13px}}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:transparent;padding:8px 12px;white-space:nowrap;border-radius:9px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:not([aria-selected="true"]):hover{background:var(--surface-2);color:var(--ink)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.toolbar .hint{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}

.btn.ghost:hover{color:var(--off);border-color:transparent}
.confirmbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--wait-soft);border-radius:10px;padding:10px 12px;font-size:14px}

/* days */

const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
// Private clients sharing one place (e.g. 私教課 - 王小姐) are paid separately, so they reconcile separately
const clientOf = content => { const m = String(content||'').split(/\s*-\s*/); return m.length>1 ? m.slice(1).join(' - ').trim() : ''; };
const srcKey = (place,kind,content) => { const c = clientOf(content); return (place||'').trim()+'｜'+(kind||'').trim()+(c?'｜'+c:''); };
const SCHEDULE_VERSION = 7;   // bump when the built-in weekly schedule changes
const START_MONTH = '2026-09'; // first month the ledger covers
const clone = o => JSON.parse(JSON.stringify(o));
const emptyMonth = () => ({entries:{}, extras:[], received:{}});

const TODAY = ymd(now);
let monthKey = now.getFullYear()+'-'+pad(now.getMonth()+1);
if(monthKey < START_MONTH) monthKey = START_MONTH;

/* ---------- storage: this browser ---------- */
const LS = 'coach-ledger:';
let storageOK = true;
function lsGet(p){ try{ const v = localStorage.getItem(LS+p); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(p,v){ try{ localStorage.setItem(LS+p, JSON.stringify(v)); storageOK = true; }catch(e){ storageOK = false; } }
function lsDel(p){ try{ localStorage.removeItem(LS+p); }catch(e){} }
function setSave(kind, text){ const el=$('#saveState'); el.className='savestate '+kind; el.querySelector('span').textContent=text; }
function daysSince(iso){ return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function whenText(iso){
  const d = new Date(iso);
  return ymd(d)===ymd(new Date()) ? '今天 '+pad(d.getHours())+':'+pad(d.getMinutes()) : (d.getMonth()+1)+'/'+d.getDate();
}

/* ---------- Google Drive sync ---------- */
const DRIVE_ON = !!GOOGLE_CLIENT_ID;
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILE = '教練收入對帳-自動同步.json';
const DRIVE_FOLDER = '教練收入對帳';   // the sync file and the monthly backups live in this folder
const dm = lsGet('meta/drive') || {};
const drive = {connected:!!dm.connected, fileId:dm.fileId||null, folderId:dm.folderId||null, inFolder:!!dm.inFolder, lastSync:dm.lastSync||null,
  token:null, exp:0, client:null, dirty:!!dm.dirty, syncing:false, again:false, offline:false, authFail:false,
  lastAutoAsk:0, afterAuth:null, timer:null,
  known:dm.known||null,      // Drive file modifiedTime this device last synced with
  needCheck:false, conflict:null, forcePush:false, checking:false, lastCheck:0};
const tk = lsGet('meta/token');
if(tk && tk.exp > Date.now()){ drive.token = tk.t; drive.exp = tk.exp; }
const tokenValid = () => !!drive.token && Date.now() < drive.exp;
function saveDriveMeta(){ lsSet('meta/drive', {connected:drive.connected, fileId:drive.fileId, folderId:drive.folderId, inFolder:drive.inFolder, lastSync:drive.lastSync, dirty:drive.dirty, known:drive.known}); }
// JSON with object keys sorted, so two copies of the same data compare equal
const stable = v => JSON.stringify(v, (k,x)=> x && typeof x==='object' && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(key=>[key,x[key]])) : x);

function refreshSaveState(){
  const btn = $('#driveBtn');
  if(DRIVE_ON){
    $('#driveRestoreBtn').hidden = !drive.connected;
    $('#driveFolderBtn').hidden = !drive.connected || !drive.folderId;
    const sb = $('#syncNowBtn'); sb.hidden = !drive.connected; sb.disabled = !!drive.manualRunning; sb.textContent = drive.manualRunning ? '同步中…' : '⟳ 立即同步';
    $('#driveOffBtn').hidden = !drive.connected;
  }
  if(!storageOK){ setSave('err','這個瀏覽器不能存資料（可能是無痕模式），關掉就會消失'); return; }
  if(!DRIVE_ON){
    btn.hidden = true;
    const meta = lsGet('meta/backup');
    if(!meta || !meta.at){ setSave('warn','已存在這支手機 · 還沒備份過'); return; }
    const d = daysSince(meta.at);
    if(d>=30) setSave('warn',`已存在這支手機 · 上次備份 ${d} 天前`);
    else setSave('ok',`已存在這支手機 · 上次備份 ${d===0?'今天':d+' 天前'}`);
    return;
  }
  if(!drive.connected){
    btn.hidden = false; btn.textContent = '連線 Google 雲端硬碟';
    setSave('warn','只存在這支手機 · 還沒連線雲端硬碟'); return;
  }
  const needAuth = (drive.dirty || drive.needCheck) && !tokenValid();
  const hasErr = drive.dirty && !!drive.error && !needAuth && !drive.syncing;
  btn.hidden = !(needAuth || hasErr); btn.textContent = hasErr ? '重試同步' : '重新連線雲端硬碟';
  if(drive.syncing) setSave('busy','同步到雲端硬碟中…');
  else if(hasErr) setSave('err', drive.error+' · 資料仍安全存在這台裝置');
  else if(drive.dirty && drive.offline) setSave('warn','沒有網路 · 有網路後會自動同步');
  else if(needAuth) setSave('warn', drive.dirty ? '有變更還沒存到雲端硬碟 · 請按「重新連線」' : '請按「重新連線」取得其他裝置的最新資料');
  else if(drive.conflict) setSave('warn','雲端硬碟和這台的資料不同 · 請選擇要用哪一份');
  else if(drive.checking) setSave('busy','檢查雲端硬碟有沒有更新…');
  else if(drive.dirty) setSave('busy','準備同步…');
  else if(drive.lastSync) setSave('ok','已同步到雲端硬碟 · '+whenText(drive.lastSync));
  else setSave('ok','已連線雲端硬碟');
}

function payload(){ return {app:'coach-ledger', version:1, exportedAt:new Date().toISOString(), data:allData()}; }
async function gfetch(url, opts={}){
  let r;
  try{ r = await fetch(url, {...opts, headers:{...(opts.headers||{}), Authorization:'Bearer '+drive.token}}); }
  catch(e){ throw {offline:true}; }
  if(r.status===401){ drive.token=null; lsDel('meta/token'); throw {auth:true}; }
  return r;
}
// Turn a failed Drive response into a readable reason
async function apiErr(r){
  let msg = '', reason = '';
  try{ const j = await r.json(); msg = (j.error && j.error.message) || ''; reason = (j.error && ((j.error.errors && j.error.errors[0] && j.error.errors[0].reason) || j.error.status)) || ''; }catch(e){}
  const all = reason+' '+msg;
  if(/accessNotConfigured|SERVICE_DISABLED|has not been used|is disabled/i.test(all))
    return {status:r.status, text:'這個 Google Cloud 專案還沒啟用 Google Drive API'};
  if(/insufficient|scope/i.test(all)){ drive.token=null; lsDel('meta/token'); return {auth:true}; }
  if(r.status===429 || /rateLimit|userRateLimit/i.test(all)) return {status:r.status, text:'雲端硬碟暫時太忙，稍後自動重試', retry:true};
  if(r.status>=500) return {status:r.status, text:'雲端硬碟暫時沒回應，稍後自動重試', retry:true};
  return {status:r.status, text:`雲端硬碟回傳錯誤 ${r.status}${msg?'：'+msg:''}`};
}
// The 教練收入對帳 folder (found or created once, then remembered)
async function ensureFolder(){
  if(drive.folderId){
    const r = await gfetch(`https://www.googleapis.com/drive/v3/files/${drive.folderId}?fields=id,trashed`);
    if(r.ok){ const j = await r.json(); if(!j.trashed) return drive.folderId; }
    else if(r.status!==404) throw await apiErr(r);
    drive.folderId = null; drive.inFolder = false;
  }
  const q = encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r = await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime&pageSize=1&fields=files(id)&spaces=drive`);
  if(!r.ok) throw await apiErr(r);
  const j = await r.json();
  if(j.files && j.files[0]){ drive.folderId = j.files[0].id; saveDriveMeta(); return drive.folderId; }
  const c = await gfetch('https://www.googleapis.com/drive/v3/files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:DRIVE_FOLDER, mimeType:'application/vnd.google-apps.folder', description:'教練月收入對帳：自動同步檔和每月備份'})});
  if(!c.ok) throw await apiErr(c);
  drive.folderId = (await c.json()).id; drive.inFolder = false; saveDriveMeta();
  return drive.folderId;
}
// Older versions put the sync file at the top of Drive: move it into the folder once
async function moveIntoFolder(){
  if(drive.inFolder || !drive.fileId) return;
  const folder = await ensureFolder();
  const r = await gfetch(`https://www.googleapis.com/drive/v3/files/${drive.fileId}?fields=parents`);
  if(!r.ok) throw await apiErr(r);
  const parents = (await r.json()).parents || [];
  if(!parents.includes(folder)){
    const m = await gfetch(`https://www.googleapis.com/drive/v3/files/${drive.fileId}?addParents=${folder}${parents.length?`&removeParents=${parents.join(',')}`:''}&fields=id,modifiedTime`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:'{}'});
    if(!m.ok) throw await apiErr(m);
  }
  drive.inFolder = true; saveDriveMeta();
}
// 每月自動備份: the first time the page syncs in a new month, save a copy named by the date (e.g. 2026-10-01.json)
let monthlyRunning = false;
async function monthlyBackup(){
  if(monthlyRunning || !drive.connected || !tokenValid() || drive.conflict || drive.dirty) return;
  const mk = TODAY.slice(0,7), m = lsGet('meta/monthly') || {};
  if(!m.from){ m.from = mk; lsSet('meta/monthly', m); }   // starts the month after it is turned on
  if(mk <= m.from || m.done === mk || !hasRecords(allData())) return;
  monthlyRunning = true;
  try{
    const folder = await ensureFolder();
    const q = encodeURIComponent(`'${folder}' in parents and name contains '${mk}-' and trashed=false`);
    const r = await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&pageSize=5&fields=files(id,name)&spaces=drive`);
    if(!r.ok) throw await apiErr(r);
    const found = ((await r.json()).files || []).some(f=>/^\d{4}-\d{2}-\d{2}\.json$/.test(f.name) && f.name.startsWith(mk+'-'));
    if(!found){   // another device may already have made this month's backup
      const boundary = 'coachbackup'+Date.now();
      const meta = {name:TODAY+'.json', parents:[folder], mimeType:'application/json', description:`教練月收入對帳 ${TODAY} 的自動備份，可以用「從備份檔還原」匯入。`};
      const mp = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload(),null,1)}\r\n--${boundary}--`;
      const c = await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+boundary}, body:mp});
      if(!c.ok) throw await apiErr(c);
      toast(`已自動備份到雲端硬碟：${DRIVE_FOLDER}/${TODAY}.json`);
    }
    m.done = mk; lsSet('meta/monthly', m);
  }catch(e){ /* try again next time the page syncs */ }
  monthlyRunning = false;
}
async function findFileMeta(){
  const q = encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const r = await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime%20desc&pageSize=1&fields=files(id,modifiedTime)&spaces=drive`);
  if(!r.ok) throw await apiErr(r);
  const j = await r.json();
  return j.files && j.files[0] ? j.files[0] : null;
}
async function findFile(){ const f = await findFileMeta(); return f ? f.id : null; }
// {id, modifiedTime} of the sync file, or null when there is none yet
async function getRemoteMeta(){
  if(drive.fileId){
    const r = await gfetch(`https://www.googleapis.com/drive/v3/files/${drive.fileId}?fields=id,modifiedTime,trashed`);
    if(r.ok){ const j = await r.json(); if(!j.trashed) return j; }
    else if(r.status!==404) throw await apiErr(r);
    drive.fileId = null;
  }
  const f = await findFileMeta();
  if(f) drive.fileId = f.id;
  return f;
}
async function readRemote(){
  if(!drive.fileId) drive.fileId = await findFile();
  if(!drive.fileId) return null;
  const r = await gfetch(`https://www.googleapis.com/drive/v3/files/${drive.fileId}?alt=media`);
  if(r.status===404){ drive.fileId=null; return null; }
  if(!r.ok) throw await apiErr(r);
  return r.json();
}
async function writeRemote(body){
  if(drive.fileId){
    const r = await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${drive.fileId}?uploadType=media&fields=id,modifiedTime`,
      {method:'PATCH', headers:{'Content-Type':'application/json'}, body});
    if(r.ok) return (await r.json()).modifiedTime;
    if(r.status!==404) throw await apiErr(r);
    drive.fileId = null;
  }
  const boundary = 'coachledger'+Date.now();
  const folder = await ensureFolder();
  const meta = {name:DRIVE_FILE, parents:[folder], mimeType:'application/json', description:'教練月收入對帳的自動同步資料，請不要改名或刪除。'};
  const mp = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
  const r = await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',
    {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+boundary}, body:mp});
  if(!r.ok) throw await apiErr(r);
  const j = await r.json();
  drive.fileId = j.id; drive.inFolder = true;
  return j.modifiedTime;
}
// Replace this device's data with what is on Drive
function pullRemote(remote, meta){
  clearTimeout(drive.timer);
  applyData(remote.data);
  clearTimeout(drive.timer);
  drive.dirty = false; drive.again = false; drive.known = meta ? meta.modifiedTime : drive.known;
  drive.lastSync = new Date().toISOString(); drive.offline = false; drive.error = null;
  saveDriveMeta();
}
// Two-way sync: bring in another device's newer data, or ask when both sides changed
async function syncCheck(){
  if(!DRIVE_ON || !drive.connected) return;
  if(!tokenValid()){ drive.needCheck = true; refreshSaveState(); return; }
  if(drive.checking || drive.syncing) return;
  drive.checking = true; drive.needCheck = false; drive.lastCheck = Date.now(); refreshSaveState();
  try{
    let meta = await getRemoteMeta();
    if(meta && !drive.inFolder){ const was = drive.known===meta.modifiedTime; await moveIntoFolder(); meta = await getRemoteMeta(); if(was && meta) drive.known = meta.modifiedTime; }   // moving is not a data change
    if(!meta && hasRecords(allData())) drive.dirty = true;                                  // nothing on Drive yet: upload this device's data
    if(meta && meta.modifiedTime !== drive.known){
      const remote = await readRemote();
      if(remote && remote.app==='coach-ledger'){
        if(stable(remote.data)===stable(allData())) drive.known = meta.modifiedTime;          // same content
        else if(!drive.dirty){ pullRemote(remote, meta); toast('已載入其他裝置的最新資料'); }   // nothing unsaved here
        else drive.conflict = {remote, meta};                                                  // both changed
      }
    }
    drive.offline = false;
  }catch(e){ if(e && e.offline) drive.offline = true; else if(e && e.auth) drive.needCheck = true; else if(e) drive.error = e.text; }
  drive.checking = false; saveDriveMeta(); refreshSaveState(); renderConflict();
  if(!drive.conflict && drive.dirty) pushNow(); else monthlyBackup();
}
// 立即同步: bring in other devices' changes, upload this device's data, then read it back and compare
const waitIdle = async (ms=15000) => { const t0 = Date.now(); while((drive.syncing || drive.checking) && Date.now()-t0 < ms) await new Promise(r=>setTimeout(r,150)); };
async function manualSync(){
  if(!DRIVE_ON) return;
  if(!drive.connected){ askAuth(null, false); return; }
  if(!tokenValid()){ drive.lastAutoAsk = Date.now(); askAuth('sync', true); return; }
  if(drive.manualRunning) return;
  drive.manualRunning = true; refreshSaveState();
  try{
    await waitIdle();
    drive.lastCheck = 0; await syncCheck(); await waitIdle();
    if(drive.conflict){ toast('雲端硬碟和這台都有修改，請先在上方選擇要用哪一份，再按一次立即同步'); return; }
    if(drive.error || drive.offline){ toast(drive.offline ? '沒有網路，資料還在這台，有網路後再按一次' : '同步失敗：'+drive.error); return; }
    drive.dirty = true; await pushNow(); await waitIdle();
    if(drive.conflict){ toast('雲端硬碟上剛好有其他裝置的更新，請先在上方選擇要用哪一份'); return; }
    if(drive.dirty || drive.error || drive.offline || !tokenValid()){ toast(drive.offline ? '沒有網路，資料還在這台，有網路後再按一次' : '沒有傳上去，請再按一次立即同步'); return; }
    const remote = await readRemote();
    if(remote && remote.app==='coach-ledger' && stable(remote.data)===stable(allData())){
      drive.lastSync = new Date().toISOString(); saveDriveMeta();
      toast('已確認：這台的資料都在雲端硬碟 · '+whenText(drive.lastSync));
    } else toast('比對結果不一致，請再按一次立即同步');
  }catch(e){ driveErr(e); toast(e && e.offline ? '沒有網路，資料還在這台，有網路後再按一次' : '同步失敗，請再按一次'); }
  finally{ drive.manualRunning = false; refreshSaveState(); }
}
function renderConflict(){
  const el = $('#syncConflict'); if(!el) return;
  if(!drive.conflict){ el.hidden = true; return; }
  const t = drive.conflict.meta && drive.conflict.meta.modifiedTime;
  $('#conflictWhen').textContent = t ? whenText(t) : '';
  el.hidden = false;
}
function driveErr(e){
  drive.dirty = true;
  drive.offline = !!(e && e.offline);
  drive.error = (e && !e.offline && !e.auth) ? (e.text || '同步失敗') : null;
  clearTimeout(drive.retryTimer);
  if(drive.error){ drive.retryTimer = setTimeout(pushNow, e.retry ? 20000 : 60000); }
}
async function pushNow(){
  clearTimeout(drive.timer);
  if(!DRIVE_ON || !drive.connected) return;
  if(!tokenValid()){ drive.dirty = true; saveDriveMeta(); refreshSaveState(); return; }
  if(drive.syncing){ drive.again = true; return; }
  drive.syncing = true; drive.dirty = false; refreshSaveState();
  try{
    if(!drive.forcePush){
      const meta = await getRemoteMeta();
      if(meta && meta.modifiedTime !== drive.known){
        const remote = await readRemote();
        if(remote && remote.app==='coach-ledger' && stable(remote.data)!==stable(allData())){
          drive.syncing = false; drive.again = false;
          if(!hasRecords(allData())){ pullRemote(remote, meta); refreshSaveState(); toast('已從雲端硬碟載入之前的記錄'); return; }   // a new device
          drive.dirty = true; drive.conflict = {remote, meta};
          saveDriveMeta(); refreshSaveState(); renderConflict(); return;
        }
      }
    }
    drive.forcePush = false;
    drive.known = await writeRemote(JSON.stringify(payload())) || drive.known;
    drive.lastSync = new Date().toISOString(); drive.offline = false; drive.error = null;
    lsSet('meta/backup', {at:drive.lastSync});
  }catch(e){ driveErr(e); }
  drive.syncing = false; saveDriveMeta(); refreshSaveState();
  if(drive.again){ drive.again = false; pushNow(); } else monthlyBackup();
}
function scheduleSync(){
  if(!DRIVE_ON || !drive.connected) return;
  drive.dirty = true; saveDriveMeta();
  clearTimeout(drive.timer); drive.timer = setTimeout(pushNow, 1500);
}
function hasRecords(data){ return Object.keys(data||{}).some(k=>k.startsWith('months/')); }

function initGoogle(){
  if(!DRIVE_ON) return;
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onload = () => {
    drive.client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID, scope: SCOPE, 
      callback: resp => {
        if(resp.error){ authFailed(); return; }
        if(!google.accounts.oauth2.hasGrantedAllScopes(resp, SCOPE)){ toast('要勾選允許存取雲端硬碟，才能同步'); authFailed(); return; }
        drive.token = resp.access_token;
        drive.exp = Date.now() + (Number(resp.expires_in||3600) - 120) * 1000;
        lsSet('meta/token', {t:drive.token, exp:drive.exp});
        const next = drive.afterAuth; drive.afterAuth = null;
        onAuthorized(next);
      },
      error_callback: () => authFailed()
    });
  };
  s.onerror = () => { drive.offline = true; refreshSaveState(); };
  document.head.appendChild(s);
}
function authFailed(){ drive.afterAuth = null; refreshSaveState(); }
function askAuth(next, silent){
  if(!drive.client){ toast('Google 登入還在載入，請過幾秒再按一次'); return; }
  drive.afterAuth = next || null;
  drive.client.requestAccessToken(silent && drive.connected ? {prompt:''} : {});
}
async function onAuthorized(next){
  const first = !drive.connected;
  drive.connected = true; saveDriveMeta();
  if(next==='restore'){ restoreFromDrive(); return; }
  if(next==='sync'){ manualSync(); return; }
  if(first) toast('已連線，之後每次修改都會自動存到雲端硬碟');
  syncCheck();
}
async function restoreFromDrive(){
  if(!tokenValid()){ askAuth('restore'); return; }
  try{
    setSave('busy','讀取雲端硬碟…');
    const remote = await readRemote();
    if(!remote || remote.app!=='coach-ledger'){ toast('雲端硬碟裡還沒有同步檔'); refreshSaveState(); return; }
    const months = Object.keys(remote.data).filter(k=>k.startsWith('months/')).length;
    if(!window.confirm(`用雲端硬碟上的資料（${String(remote.exportedAt||'').slice(0,16).replace('T',' ')}，${months} 個月的記錄）取代這支手機上的資料？`)){ refreshSaveState(); return; }
    let meta = null; try{ meta = await getRemoteMeta(); }catch(e){}
    pullRemote(remote, meta); drive.conflict = null; renderConflict();
    refreshSaveState(); toast('已從雲端硬碟載回資料');
  }catch(e){ driveErr(e); refreshSaveState(); }
}
function disconnectDrive(){
  if(!window.confirm('中斷後，修改只會存在這支手機，不再自動同步。雲端硬碟上的檔案會保留。確定中斷？')) return;
  try{ if(drive.token && window.google) google.accounts.oauth2.revoke(drive.token, ()=>{}); }catch(e){}

}

function queue(path, data){ lsSet(path, data); scheduleSync(); refreshSaveState(); }
const monthPath = () => 'months/'+monthKey;
const saveMonth = () => queue(monthPath(), month);
const saveSchedule = () => queue('config/schedule', {classes: schedule, v: SCHEDULE_VERSION});

/* ---------- manual backup file ---------- */
function allData(){
  const data = {};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(LS) && !k.startsWith(LS+'meta/')){ data[k.slice(LS.length)] = JSON.parse(localStorage.getItem(k)); }
    }
  }catch(e){}
  if(!data['config/schedule']) data['config/schedule'] = {classes: schedule, v: SCHEDULE_VERSION};
  return data;
}
function applyData(data){
  try{
    Object.keys(localStorage).filter(k=>k.startsWith(LS) && !k.startsWith(LS+'meta/')).forEach(k=>localStorage.removeItem(k));
    Object.entries(data).forEach(([k,v])=>{ if(!k.startsWith('meta/')) localStorage.setItem(LS+k, JSON.stringify(v)); });
  }catch(e){ toast('還原失敗：這個瀏覽器不能存資料'); return false; }
  upgradeStored();   // an older backup is converted to the current numbering right away
  loadPrepaid();
  loadSelfrun();
  loadBilling();
  watchMonth();
  return true;
}
function exportBackup(){
  const p = payload();
  const name = `教練收入備份-${ymd(new Date())}.json`;
  const text = JSON.stringify(p,null,1);
  const markDone = msg => { if(!drive.connected){ lsSet('meta/backup', {at:new Date().toISOString()}); } refreshSaveState(); toast(msg); };
  const download = () => {
    const blob = new Blob([text], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    markDone('備份檔已下載');
  };
  let file = null;
  try{ file = new File([text], name, {type:'application/json'}); }catch(e){}
  if(file && navigator.canShare && navigator.share && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name})
      .then(()=>markDone('已送出備份檔'))
      .catch(err=>{ if(err && err.name==='AbortError') toast('已取消'); else download(); });
  } else download();
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let p;
    try{ p = JSON.parse(r.result); }catch(e){ toast('這不是備份檔，無法讀取'); return; }
    if(!p || p.app!=='coach-ledger' || !p.data){ toast('這不是本頁匯出的備份檔'); return; }
    const months = Object.keys(p.data).filter(k=>k.startsWith('months/')).length;
    if(!window.confirm(`用 ${String(p.exportedAt||'').slice(0,10)} 的備份（${months} 個月的記錄）取代目前手機上的資料？`)) return;
    if(!applyData(p.data)) return;
    if(!drive.connected) lsSet('meta/backup', {at: p.exportedAt || new Date().toISOString()});
    scheduleSync(); refreshSaveState(); toast('已還原備份');
  };
  r.readAsText(file);
}
function normMonth(m){ m.entries=m.entries||{}; m.extras=m.extras||[]; m.received=m.received||{}; m.paid=m.paid||{}; m.att=m.att||{}; return m; }

/* ---------- model ---------- */
const snapOf = it => ({time:it.time, dur:it.dur, place:it.place, kind:it.kind, content:it.content, pay:it.base});
const classOn = (c, ds) => (!c.from || ds >= c.from) && (!c.until || ds <= c.until);
function daysOfMonth(mk = monthKey, mo = month){
  const [y,m] = mk.split('-').map(Number);
  const n = new Date(y, m, 0).getDate();
  const out = [];
  for(let d=1; d<=n; d++){
    const date = new Date(y, m-1, d);
    const ds = ymd(date), dow = date.getDay();
    const items = [];
    const seen = new Set();
    schedule.filter(c=>classOn(c, ds) && (typeof selfrun!=='undefined' && isSR(c.id) ? !!termOf(ds) : c.dow===dow)).forEach(c=>{   // 自營團課 only on its term dates
      const key = ds+'_'+c.id; seen.add(key);
      const e = mo.entries[key] || {};
      const src = e.snap || c;   // a recorded class keeps the details it had at the time
      items.push({key, date:ds, time:src.time, dur:src.dur, place:src.place, kind:src.kind, content:src.content,
        base:src.pay, pay: e.pay ?? src.pay, mins: e.mins ?? src.dur, override: e.pay, status: e.s || 'held', extra:false});
    });
    // records whose class is no longer on the weekly schedule for that day
    Object.entries(mo.entries).forEach(([key,e])=>{
      if(!key.startsWith(ds+'_') || seen.has(key) || !e.snap) return;
      if(typeof selfrun!=='undefined' && isSR(key.slice(11)) && !termOf(ds)) return;   // not a term date (any more)
      const sn = e.snap;
      items.push({key, date:ds, time:sn.time, dur:sn.dur, place:sn.place, kind:sn.kind, content:sn.content,
        base:sn.pay, pay:e.pay ?? sn.pay, mins: e.mins ?? sn.dur, override: e.pay, status:e.s||'held', extra:false, orphan:true});
    });
    mo.extras.filter(x=>x.date===ds).forEach(x=>{
      items.push({key:x.id, date:ds, time:x.time, dur:x.dur, place:x.place, kind:x.kind, content:x.content,
        base:x.pay, pay:x.pay, mins: x.mins ?? x.dur, status:x.s||'held', extra:true});
    });
    // 自營團課: the session's amount = 期課學費分攤 + 單堂 − 場地費
    items.forEach(it=>{
      if(it.extra || typeof selfrun==='undefined') return;
      const cid = it.key.slice(11); if(!isSR(cid)) return;
      const ss = srSession(ds, cid, mo); if(!ss) return;
      it.sr = ss; it.selfrun = cid; it.base = ss.value; it.pay = it.override ?? it.base;
    });
    // 按時間 students: the amount follows the minutes actually taught (hourly rate × hours)
    items.forEach(it=>{
      if(!isPrivate(it.content) || typeof prepaid==='undefined') return;
      const n = privName(it.content); if(!isTimeBased(n)) return;
      const base = Math.round(hourlyRateOf(n) * (it.mins||0) / 60);
      if(it.extra){ it.base = base; }                       // extra: x.pay already set from minutes
      else { it.base = base; it.pay = it.override ?? base; }
    });
    items.sort((a,b)=>a.time.localeCompare(b.time));
    out.push({ds, d, dow, items});
  }
  return out;
}
// Before a weekly class changes, pin its past days to the old details so past months don't shift
function freezePast(classId){
  const [ty,tm] = TODAY.split('-').map(Number);
  let [y,m] = START_MONTH.split('-').map(Number);
  while(y<ty || (y===ty && m<=tm)){
    const mk = y+'-'+pad(m);
    const mo = mk===monthKey ? month : normMonth(lsGet('months/'+mk) || emptyMonth());
    let changed = false;
    daysOfMonth(mk, mo).forEach(day=>{
      if(day.ds >= TODAY) return;
      day.items.forEach(it=>{
        if(it.extra || !it.key.endsWith('_'+classId)) return;
        const e = mo.entries[it.key] || {};
        if(!e.snap){ mo.entries[it.key] = {...e, snap:snapOf(it)}; changed = true; }
      });
    });
    if(changed) queue('months/'+mk, mo);
    m++; if(m>12){ m=1; y++; }
  }
}
function totals(days){
  const t = {held:0, heldN:0, wait:0, waitN:0, off:0, offN:0, all:0, n:0};
  days.forEach(day=>day.items.forEach(it=>{
    t.n++; t.all += it.pay;
    if(it.status==='held'){ t.held+=it.pay; t.heldN++; }
    else if(it.status==='off'){ t.off+=it.pay; t.offN++; }
    else { t.wait+=it.pay; t.waitN++; }
  }));
  return t;
}
function findItem(key){
  for(const day of daysOfMonth()) for(const it of day.items) if(it.key===key) return it;
  return null;
}
function setStatus(key, s){   // s: 'held' | 'off'
  const x = month.extras.find(x=>x.id===key);
  if(x){ x.s = s; saveMonth(); render(); return; }
  const it = findItem(key); if(!it) return;
  const e = {...(month.entries[key]||{})};
  e.snap = e.snap || snapOf(it);
  if(s==='off') e.s = 'off'; else delete e.s;
  month.entries[key] = e;
  saveMonth(); render();
}
function setPay(key, val){
  const v = Math.max(0, Math.round(Number(val)||0));
  const x = month.extras.find(x=>x.id===key);
  if(x){ x.pay = v; saveMonth(); render(); return; }
  const it = findItem(key); if(!it) return;
  const e = {...(month.entries[key]||{})};
  e.snap = e.snap || snapOf(it);
  if(v===it.base) delete e.pay; else e.pay = v;
  month.entries[key] = e;
  saveMonth(); render();
}

// 按時間 students: record how long the class actually ran; the amount follows (hourly rate × hours)
function setMins(key, val){
  const v = Math.max(0, Math.round(Number(val)||0));
  const x = month.extras.find(x=>x.id===key);
  if(x){ x.mins = v; x.pay = Math.round(hourlyRateOf(privName(x.content)) * v / 60); saveMonth(); render(); return; }
  const it = findItem(key); if(!it) return;
  const e = {...(month.entries[key]||{})};
  e.snap = e.snap || snapOf(it);
  if(v===it.dur) delete e.mins; else e.mins = v;
  delete e.pay;
  month.entries[key] = e;
  saveMonth(); render();
}

function pickOptions(){
  const seen = new Set(), out = [];

    const k = [c.content,c.place,c.kind,c.pay,c.time].join('|'); if(seen.has(k) || !c.content) return; seen.add(k);

  month.extras.forEach(x=>add(x, '加課 '));

// Month-at-a-glance calendar: one cell per day, a dot per class (green 有開, red 停課, outlined = 還沒到), tap to jump

// 私教課 (課名含「私教」) is paid per student; every other class is a group class paid per venue
const isPrivate = content => /私教|私人課/.test(String(content||''));
function sources(days){
  const map = new Map();
  days.forEach(d=>d.items.forEach(it=>{
    if(it.selfrun) return;   // 自營團課 has its own section
    const cat = isPrivate(it.content) ? 'private' : 'group';
    const place = (it.place||'').trim();
    const client = cat==='private' ? (clientOf(it.content) || '未寫名字') : '';
    const k = cat+'｜'+place+(client?'｜'+client:'');
    if(!map.has(k)) map.set(k,{key:k, cat, place, client, classes:new Set(), held:0, heldN:0, offN:0});
    const s = map.get(k);
    s.classes.add(cat==='group' ? it.content : '');
    if(it.status==='off') s.offN++; else { s.held+=it.pay; s.heldN++; }
  }));
  return [...map.values()].sort((a,b)=>b.held-a.held);
}
// 結算區間: a venue can bill from the (cut+1)th of last month to the cut-th of this month, named by the month it ends in
// config/billing = {places:{地點:{cut:19}}}; no entry = the calendar month
let billing = {places:{}};
function loadBilling(){ const d = lsGet('config/billing'); billing = d && d.places ? d : {places:{}}; }

function periodOf(cut, mk = monthKey){

  const c = Math.min(cut, new Date(y, m, 0).getDate());
  const end = ymd(new Date(y, m-1, c)), start = ymd(new Date(y, m-2, cut+1));
  return [start, end];
}
// every day from `start` to `end`, across months (days before the ledger's first month are left out)
function rangeDays(start, end){
  const out = [], first = START_MONTH+'-01';
  let [y,m] = start.slice(0,7).split('-').map(Number);
  const [ey,em] = end.slice(0,7).split('-').map(Number);
  while(y<ey || (y===ey && m<=em)){
    const mk = y+'-'+pad(m);
    if(mk >= START_MONTH) daysOfMonth(mk, moOf(mk)).forEach(d=>{ if(d.ds>=start && d.ds<=end && d.ds>=first) out.push(d); });
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}

// one session's share of a student's fee: fee ÷ the sessions the package covers from their start date
// 停課 sessions of a term (read from each month's records; `mo` stands in for its own month when given)
function srOffSet(t, mo, mk){
  const off = new Set();
  [...new Set(t.dates.map(d=>d.slice(0,7)))].forEach(m=>{
    const x = (mo && m===mk) ? mo : moOf(m);
    Object.entries(x.entries||{}).forEach(([k,e])=>{ if(e.s==='off' && t.dates.includes(k.slice(0,10))) off.add(k); });
  });

}
// one session's share of a student's fee: fee ÷ the sessions actually held from their start date (停課 ones don't count)
function shareOf(t, st, off){
  const cids = st.pkg==='both' ? selfrun.cids : [st.pkg];
  let n = 0;
  t.dates.forEach(d=>{ if(d >= startOf(t, st)) cids.forEach(cid=>{ if(!off || !off.has(d+'_'+cid)) n++; }); });
  return n ? (st.fee||0) / n : 0;
}
const moOf = mk => mk===monthKey ? month : normMonth(lsGet('months/'+mk) || emptyMonth());
function srSession(ds, cid, mo){
  const t = termOf(ds); if(!t) return null;
  const key = ds+'_'+cid;
  mo = mo || moOf(ds.slice(0,7));
  const a = (mo.att||{})[key] || {}, e = (mo.entries||{})[key] || {};
  const enrolled = t.students.filter(st=>inClass(st, cid) && ds >= startOf(t, st));
  const leave = enrolled.filter(st=>(a.leave||[]).includes(st.id)).map(st=>st.id);
  const makeup = (a.makeup||[]).filter(id=>!!stuOf(id).st);   // may be a student of an earlier term
  const guest = a.guest || [], single = a.single || [];
  const off = srOffSet(t, mo, ds.slice(0,7));
  const fees = enrolled.reduce((s,st)=>s+shareOf(t, st, off), 0), singles = single.reduce((s,x)=>s+(x.amount||0), 0);
  const value = Math.round(fees + singles - (t.venue||0));
  return {t, ds, cid, key, enrolled, leave, makeup, guest, single, fees:Math.round(fees), singles,
    present: enrolled.length - leave.length + makeup.length + guest.length + single.length,
    status: e.s==='off' ? 'off' : 'held', value, pay: e.pay ?? value};
}

function termSessions(t){

// per student: sessions attended, leaves, make-ups taken, still owed
function srTally(t, sessions){
  const r = {};
  t.students.forEach(st=>r[st.id] = {came:0, due:0, leave:0, makeup:0, leaveDates:[], makeupDates:[]});
  sessions.forEach(s=>{
    if(s.status!=='held') return;
    const past = s.ds <= TODAY;
    s.enrolled.forEach(st=>{ const x = r[st.id]; x.due++; if(s.leave.includes(st.id)){ x.leave++; x.leaveDates.push({...s}); } else if(past) x.came++; });
  });
  // make-ups can be taken in any term (e.g. a 第 6 期 leave made up during 第 7 期)
  (selfrun.terms||[]).forEach(tt=>(tt===t ? sessions : termSessions(tt)).forEach(s=>{
    if(s.status!=='held') return;
    s.makeup.forEach(id=>{ const x = r[id]; if(!x) return; x.makeup++; x.makeupDates.push(s); if(s.ds <= TODAY) x.came++; });
    s.guest.forEach(g=>{ const x = g.for && r[g.for]; if(!x) return; x.makeup++; x.makeupDates.push({...s, by:g.name, forKey:g.forKey});   // someone else came in their place
      const lv = g.forKey && x.leaveDates.find(l=>l.key===g.forKey); if(lv) lv.by = `${g.name} ${md(s.ds)}${srShort(s.cid)}`; });
  }));
  Object.values(r).forEach(x=>{ x.owed = Math.max(0, x.leave - x.makeup); x.ahead = Math.max(0, x.makeup - x.leave); });
  return r;
}

// Every held private class up to `upto` (inclusive), per student
function heldPrivateClasses(upto){
  const out = {};
  const [ey,em] = upto.slice(0,7).split('-').map(Number);
  let [y,m] = START_MONTH.split('-').map(Number);
  while(y<ey || (y===ey && m<=em)){
    const mk = y+'-'+pad(m);
    const mo = mk===monthKey ? month : normMonth(lsGet('months/'+mk) || emptyMonth());
    daysOfMonth(mk, mo).forEach(day=>{
      if(day.ds > upto) return;
      day.items.forEach(it=>{
        if(it.status!=='held' || !isPrivate(it.content)) return;
        const n = privName(it.content);
        (out[n] = out[n] || []).push({date:day.ds, time:it.time, content:it.content, place:it.place, mins:it.mins});
      });
    });
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
// Running balance: a purchase counts from the start of its day, "目前剩餘" is the balance at the end of its day.
// Classes before the first entry are not deducted.
function ledgerOf(name, classes, upto){
  const st = prepaid.students[name] || {entries:[]};
  const entries = (st.entries||[]).filter(e=>e.date<=upto);
  if(!entries.length) return {started:false, balance:0, rows:[]};
  // Deduction starts on the purchase day, or the day after a "目前剩餘" entry
  const nextDay = d => { const x = new Date(d+'T00:00:00'); x.setDate(x.getDate()+1); return ymd(x); };
  const start = entries.map(e=>e.type==='set' ? nextDay(e.date) : e.date).sort()[0];
  const ev = [];
  entries.forEach(e=>ev.push({date:e.date, order:e.type==='set'?2:0, kind:e.type, e}));
  (classes||[]).forEach(c=>{ if(c.date>=start) ev.push({date:c.date, order:1, kind:'class', c}); });
  ev.sort((a,b)=>a.date.localeCompare(b.date) || a.order-b.order);
  const time = unitOf(name)==='time', U = time ? '小時' : '堂';
  let bal = 0; const rows = [];
  ev.forEach(x=>{
    if(x.kind==='buy'){ bal += x.e.count; rows.push({date:x.date, text:`購買 ${fmtQ(x.e.count)} ${U}`, amount:x.e.amount, delta:'+'+fmtQ(x.e.count), bal, id:x.e.id}); }
    else if(x.kind==='set'){ bal = x.e.count; rows.push({date:x.date, text:`登記目前剩餘 ${fmtQ(x.e.count)} ${U}`, delta:'＝'+fmtQ(x.e.count), bal, id:x.e.id}); }
    else { const d = time ? (x.c.mins||0)/60 : 1; bal -= d; rows.push({date:x.date, text:`上課 ${x.c.time} ${x.c.content}${time?` · ${x.c.mins} 分鐘`:''}`, delta:'−'+fmtQ(d), bal}); }
  });
  bal = Math.round(bal*100)/100;
  return {started:true, balance:bal, rows};
}
function balanceChip(l, comingThisMonth, U='堂'){

  if(l.balance<0) return `<span class="chip bad">超上 ${fmtQ(-l.balance)} ${U}，未付</span>`;
  if(l.balance<=2) return '<span class="chip wait">快用完</span>';
  if(comingThisMonth > l.balance) return `<span class="chip wait">這個月會不夠 ${fmtQ(comingThisMonth - l.balance)} ${U}</span>`;
  return '<span class="chip ok">足夠</span>';
}

// 開新一期: name, first date, how many weeks, prices; optionally carry the last term's students over as 未繳費
let srNewOpen = false, srTermDel = null;

  const held = sessions.filter(s=>s.status==='held');

  const singles = held.reduce((a,s)=>a+s.singles,0), singleN = held.reduce((a,s)=>a+s.single.length,0);

      const tags = [s.leave.length?`假 ${s.leave.length}`:'', (s.makeup.length+s.guest.length)?`補 ${s.makeup.length+s.guest.length}`:'', s.single.length?`單 ${s.single.length}`:''].filter(Boolean).join(' · ');

// For one month: what came in, what was taught, and what is still owed at `asOf` (default: month end).
// 私教課 covers every private student; only 預繳 students can leave something owed.
function finMonth(mk, asOf){
  const mo = moOf(mk), days = daysOfMonth(mk, mo);
  const [y,m] = mk.split('-').map(Number), end = asOf || ymd(new Date(y, m, 0));
  const sr = {cash:0, used:0, def:0}, pv = {cash:0, used:0, def:0, buys:0};
  days.forEach(d=>d.items.forEach(it=>{
    if(it.status!=='held') return;
    if(it.sr) sr.used += Math.min(it.sr.fees, it.pay + (it.sr.t.venue||0));   // 期課學費 part of the session
    else if(isPrivate(it.content)){
      pv.used += it.pay;
      if(!isPrepaid(privName(it.content))) pv.cash += it.pay;                  // 月結 / 堂結: paid for as taught
    }
  }));
  (selfrun.terms||[]).forEach(t=>t.students.forEach(st=>{ if((st.paid||'').slice(0,7)===mk) sr.cash += st.fee||0; }));
  Object.entries(prepaid.students).forEach(([n,st])=>{ if(isPrepaid(n)) (st.entries||[]).forEach(e=>{ if(e.type==='buy' && e.date.slice(0,7)===mk) pv.buys += e.amount||0; }); });
  pv.cash += pv.buys;
  // still owed
  const classes = heldPrivateClasses(end);
  Object.keys(prepaid.students).filter(isPrepaid).forEach(n=>{
    const l = ledgerOf(n, classes[n], end);
    if(l.started && l.balance>0) pv.def += l.balance * (unitOf(n)==='time' ? hourlyRateOf(n) : unitPriceOf(n));
  });
  (selfrun.terms||[]).forEach(t=>{
    const off = srOffSet(t);
    termSessions(t).forEach(s=>{
      if(s.ds<=end || s.status!=='held') return;
      s.enrolled.forEach(st=>{ if(st.paid && st.paid<=end) sr.def += shareOf(t, st, off); });
    });
  });
  [sr,pv].forEach(o=>Object.keys(o).forEach(k=>o[k] = Math.round(o[k])));
  return {mk, sr, pv, def: sr.def + pv.def};
}

function renderSched(){
  const order = [1,2,3,4,5,6,0];
  const active = schedule.filter(c=>!c.until || c.until>=TODAY);
  const sorted = [...active].sort((a,b)=>order.indexOf(a.dow)-order.indexOf(b.dow) || a.time.localeCompare(b.time));
  const perDay = order.map(d=>({d, sum:active.filter(c=>c.dow===d).reduce((s,c)=>s+(+c.pay||0),0)}));
  const week = perDay.reduce((s,x)=>s+x.sum,0);
  let last = null;
  const rows = sorted.map(c=>{
    const start = c.dow!==last; last=c.dow;
    return `<tr class="${start?'dowstart':''}">
      <td><select class="field w-dow" id="s-${c.id}-dow" data-id="${c.id}" data-f="dow">${order.map(d=>`<option value="${d}"${d===c.dow?' selected':''}>週${DOW[d]}</option>`).join('')}</select></td>
      <td><input class="field w-time num" id="s-${c.id}-time" type="time" value="${esc(c.time)}" data-id="${c.id}" data-f="time"></td>
      <td><input class="field w-dur num" id="s-${c.id}-dur" type="number" min="0" step="5" value="${c.dur}" data-id="${c.id}" data-f="dur"></td>
      <td><input class="field" id="s-${c.id}-place" value="${esc(c.place)}" data-id="${c.id}" data-f="place"></td>
      <td><input class="field" id="s-${c.id}-content" value="${esc(c.content)}" data-id="${c.id}" data-f="content"></td>
      <td><input class="field w-pay num" id="s-${c.id}-pay" type="number" min="0" step="50" value="${c.pay}" data-id="${c.id}" data-f="pay"></td>
      <td><button class="del" aria-label="刪除這堂課" title="從每週課表刪除" data-sdel="${c.id}">×</button></td>
    </tr>`;
  }).join('');
  $('#view').innerHTML = `
    <div class="toolbar"><div class="weekstrip">${perDay.map(x=>`<span>週${DOW[x.d]} <b>${money(x.sum)}</b></span>`).join('')}<span>一週 <b>NT$ ${money(week)}</b></span></div>
      <button class="btn primary" id="addClass">＋ 新增固定課</button></div>
    <p class="note" style="margin-top:8px">這是每個月自動展開的固定課表。在這裡新增、修改或刪除，只會影響今天以後的課，今天以前的帳不會變。以前某一天的課不一樣，請到「逐日記錄」那一天改金額、按停課或加臨時課。</p>
    <div class="card tablewrap sched" style="margin-top:8px"><table>
      <thead><tr><th>星期</th><th>時間</th><th>分鐘</th><th>地點</th><th>上課內容</th><th>薪水</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,1800); }
function shiftMonth(n){
  const [y,m] = monthKey.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  const next = d.getFullYear()+'-'+pad(d.getMonth()+1);
  if(next < START_MONTH) return;
  monthKey = next; srTermId = null;   // 自營團課 follows the month again until a term is picked
  addOpenFor=null; confirmBulk=false;
  watchMonth();
}

    render(); toast(g && g.auto ? '已刪除這筆代補，連帶登記的請假也取消了' : '已刪除這筆代補'); return;
  }
  if(t.dataset.srsgdel){
    const i = t.dataset.srsgdel.lastIndexOf('|'), k = t.dataset.srsgdel.slice(0,i), idx = Number(t.dataset.srsgdel.slice(i+1));
    srEdit(k, a=>{ (a.single||[]).splice(idx,1); }); render(); toast('已刪除這筆單堂'); return;

  if(t.dataset.srdelno){ srDel = null; render(); return; }
  if(t.dataset.srdelyes){
    const id = t.dataset.srdelyes, {t:tm, st} = stuOf(id); if(!st) return;

    [...new Set(tm.dates.map(d=>d.slice(0,7)))].forEach(mk=>{
      const mo = moOf(mk); let ch = false;
      Object.entries(mo.att||{}).forEach(([k,a])=>{ if(!tm.dates.includes(k.slice(0,10))) return;
        ['leave','makeup'].forEach(f=>{ if((a[f]||[]).includes(id)){ a[f] = a[f].filter(x=>x!==id); ch = true; } }); });
      if(ch){ if(mk===monthKey) saveMonth(); else queue('months/'+mk, mo); }

  if(t.dataset.srdatedel){

    tm.students.forEach(st=>{ if(st.from===d) st.from = tm.dates.filter(x=>x>d).sort()[0] || tm.dates[0]; });
    saveSelfrun(); render(); toast(`已刪除 ${md(d)}，每堂學費分攤已重算`); return;
  }
  if(t.dataset.paidbtn){ const k=t.dataset.paidbtn; if(month.paid[k]) delete month.paid[k]; else month.paid[k]=true; saveMonth(); render(); return; }

  if(t.dataset.del){ month.extras = month.extras.filter(x=>x.id!==t.dataset.del); saveMonth(); render(); toast('已刪除加課'); return; }
  if(t.dataset.add){ addOpenFor=t.dataset.add; render(); const f=$('#ax-time'); f&&f.focus(); return; }

  if(t.id==='bulkAsk'){ confirmBulk=true; render(); return; }
  if(t.id==='bulkNo'){ confirmBulk=false; render(); return; }
  if(t.id==='bulkYes'){
    let n=0;
    daysOfMonth().filter(d=>d.ds<=TODAY).forEach(d=>d.items.forEach(it=>{
      if(it.status==='none' && !it.extra){ month.entries[it.key] = {...(month.entries[it.key]||{}), s:'held',

    else c.until = yesterday;                                                       // keep it on past days
    saveSchedule(); render(); toast('已從每週課表刪除，今天以前的帳不受影響'); return;
  }
});

document.addEventListener('change', e=>{
  const el = e.target;
  if(el.dataset.modeFor!==undefined){
    const n = el.dataset.modeFor, m = el.value;
    setMode(n, m);
    if(m==='prepaid' && !(prepaid.students[n].entries||[]).length) ppOpen = n;
    render(); toast(`${n} 改成${MODES[m]}`); return;
  }
  if(el.dataset.srlv!==undefined){
    const i = el.dataset.srlv.lastIndexOf('|'), k = el.dataset.srlv.slice(0,i), id = el.dataset.srlv.slice(i+1);
    srEdit(k, a=>{ a.leave = (a.leave||[]).filter(x=>x!==id); if(!el.checked) a.leave.push(id); }); render(); return;
  }
  if(el.dataset.srpkg!==undefined){
    const {t:tm, st} = stuOf(el.dataset.srpkg); if(!st) return;
    if((st.fee||0)===pkgPrice(st.pkg, tm)) st.fee = pkgPrice(el.value, tm);   // fee still the list price → follow the new package
    st.pkg = el.value; saveSelfrun(); render(); toast(`${st.name} 改成${pkgName(st.pkg, tm)}，學費 NT$${money(st.fee)}`); return;
  }
  if(el.dataset.srfee!==undefined){ const {st} = stuOf(el.dataset.srfee); if(!st) return; st.fee = Math.max(0, Math.round(Number(el.value)||0)); saveSelfrun(); render(); return; }
  if(el.dataset.srpaid!==undefined){ const {st} = stuOf(el.dataset.srpaid); if(!st) return; st.paid = el.value || ''; saveSelfrun(); render(); return; }
  if(el.dataset.srset!==undefined){
    const k = el.dataset.srset, v = Math.max(0, Math.round(Number(el.value)||0));
    const tm = (selfrun.terms||[]).find(x=>x.id===srShown); if(!tm) return;
    if(k==='one' || k==='both') (tm.price = tm.price || {})[k] = v; else tm[k] = v;
    saveSelfrun(); render(); return;
  }
  if(el.name==='for' && el.form && el.form.classList.contains('srgs')){
    const w = el.form.elements.when, o = el.selectedOptions[0];
    const opts = o && o.dataset.when ? JSON.parse(o.dataset.when) : [];
    w.innerHTML = `<option value="">代替哪一堂的假…</option>` + opts.map(x=>`<option value="${esc(x.k)}">${esc(x.l)}</option>`).join('');
    w.hidden = !el.value; w.required = !!el.value;
    return;
  }
  if(el.name==='p' && el.form && el.form.classList.contains('sradd')){ const tm = (selfrun.terms||[]).find(x=>x.id===srShown); if(tm) el.form.elements.f.value = pkgPrice(el.value, tm); return; }
  if(el.dataset.paid!==undefined){ const k=el.dataset.paid; if(el.checked) month.paid[k]=true; else delete month.paid[k]; saveMonth(); render(); return; }
  if(el.id==='pp-type'){
    const buy = el.value==='buy';
    $('#pp-amount-wrap').hidden = !buy; $('#pp-amount').required = buy;
    const lab = $('#pp-count-lab'); lab.textContent = (buy ? '買幾' : '剩幾') + (lab.dataset.u||'堂');
    $('#pp-note').textContent = buy ? '購買：從這天開始上的課會扣這包。' : '目前剩餘：這天（含）以前的課視為已扣完，從隔天起的課才會扣。';
    return;
  }
  if(el.id==='ax-pick'){
    const o = pickOptions()[Number(el.value)]; if(!o) return;
    const c = o.c, set = (id,v) => { const f=document.getElementById(id); if(f) f.value = v ?? ''; };
    set('ax-time', c.time); set('ax-dur', c.dur); set('ax-content', c.content); set('ax-place', c.place); set('ax-pay', c.pay);
    return;
  }
  if(el.classList.contains('payin')){ setPay(el.dataset.key, el.value); return; }
  if(el.classList.contains('minsin')){ setMins(el.dataset.key, el.value); return; }
  if(el.dataset.rateFor!==undefined){ const n=el.dataset.rateFor; const st=prepaid.students[n]||(prepaid.students[n]={entries:[]}); st.rate=Math.max(0,Math.round(Number(el.value)||0)); savePrepaid(); render(); toast(`${n} 每小時收費改成 NT$${money(st.rate)}`); return; }
  if(el.dataset.unitFor!==undefined){ const n=el.dataset.unitFor; const st=prepaid.students[n]||(prepaid.students[n]={entries:[]}); st.unit=el.value; savePrepaid(); render(); toast(`${n} 改成${el.value==='time'?'按時間扣（小時）':'按堂數扣'}`); return; }
  if(el.dataset.cut!==undefined){
    const place = el.dataset.cut, v = Math.round(Number(el.value)||0);
    if(v) billing.places[place] = {cut:v}; else delete billing.places[place];
    saveBilling(); render(); toast(v ? `${place} 改成每月 ${v} 號結算（上月 ${v+1} 號～本月 ${v} 號）` : `${place} 改回整月對帳`); return;
  }
  if(el.classList.contains('recv')){
    const v = el.value.trim();
    if(v==='') delete month.received[el.dataset.src]; else month.received[el.dataset.src] = Math.round(Number(v)||0);
    saveMonth(); render(); return;
  }
  if(el.dataset.f && el.dataset.id){
    const c = schedule.find(c=>c.id===el.dataset.id); if(!c) return;
    const f = el.dataset.f;
    if(f==='dow'){
      // Moving a class to another weekday: end the old one yesterday and start a copy today
      const nd = Math.round(Number(el.value)||0); if(nd===c.dow) return;
      const y = new Date(); y.setDate(y.getDate()-1); const yesterday = ymd(y);
      if(c.from && c.from > yesterday) c.dow = nd;
      else { c.until = yesterday; const n = {...c, id:'c'+Date.now().toString(36), dow:nd, from:TODAY}; delete n.until; schedule.push(n); }
      saveSchedule(); render(); return;
    }
    freezePast(c.id);
    c[f] = (f==='dow'||f==='dur'||f==='pay') ? Math.round(Number(el.value)||0) : el.value;
    saveSchedule(); render();
  }
});

document.addEventListener('submit', e=>{
  e.preventDefault();
  const f = e.target;
  if(f.classList.contains('ppform')){
    const n = f.dataset.name, type = $('#pp-type').value, date = $('#pp-date').value;
    const count = Math.max(0, Math.round((Number($('#pp-count').value)||0)*100)/100);
    if(!date){ toast('請選日期'); return; }
    const editId = f.dataset.editId || null;
    const entry = {id: editId || 'p'+Date.now().toString(36), type, date, count};
    if(type==='buy') entry.amount = Math.max(0, Math.round(Number($('#pp-amount').value)||0));
    const st = holder(n);
    if(editId && (st.entries||[]).some(x=>x.id===editId)) st.entries = st.entries.map(x=>x.id===editId ? entry : x);   // correct in place
    else st.entries = [...(st.entries||[]), entry];
    ppOpen = null; ppEditId = null; ppDetail = n; saveHolder(n); render();
    const nm = nameOf(n);
    toast(editId ? `已修正 ${nm} 的登記` : (type==='buy' ? `已登記 ${nm} 購買 ${count} ${unitWord(n)}` : `已登記 ${nm} 目前剩 ${count} ${unitWord(n)}`));
    return;
  }
  if(f.classList.contains('srmk')){
    const k = f.dataset.key, id = f.elements.s.value; if(!id) return;
    srEdit(k, a=>{ a.makeup = (a.makeup||[]).filter(x=>x!==id); a.makeup.push(id); });
    render(); toast(`已登記 ${(stuOf(id).st||{}).name||''} ${md(k.slice(0,10))} 補課`); return;
  }
  if(f.classList.contains('srgs')){
    const k = f.dataset.key, name = f.elements.n.value.trim(); if(!name) return;
    const g = {name};
    const who = f.elements.for.value, when = f.elements.when.value;
    if(!who){ toast('請選幫誰補'); return; }
    if(!when){ toast('請選代替哪一堂的假'); return; }
    if(who){ g.for = who; g.forKey = when;
      // the covered session gets the leave too, so both sides line up
      let added = false;
      srEdit(when, a=>{ a.leave = a.leave || []; if(!a.leave.includes(who)){ a.leave.push(who); added = true; } });
      if(added) g.auto = true; }
    srEdit(k, a=>{ (a.guest = a.guest || []).push(g); });
    render(); toast(`已登記 ${name} ${md(k.slice(0,10))} 代補 ${(stuOf(who).st||{}).name||''} ${md(when.slice(0,10))} ${srShort(when.slice(11))} 的假${g.auto?'（已一併登記請假）':''}`); return;
  }
  if(f.classList.contains('srsg') || f.classList.contains('srsg2')){
    const k = f.dataset.key || f.elements.k.value; if(!k) return;
    const entry = {name:f.elements.n.value.trim(), amount:Math.max(0, Math.round(Number(f.elements.a.value)||0))};
    srEdit(k, a=>{ (a.single = a.single || []).push(entry); });
    render(); toast(`已加入 ${md(k.slice(0,10))} ${srShort(k.slice(11))} 單堂${entry.name?' · '+entry.name:''}`); return;
  }
  if(f.classList.contains('sradd')){
    const tm = (selfrun.terms||[]).find(x=>x.id===srShown); if(!tm) return;
    const el = f.elements, name = el.n.value.trim(); if(!name) return;
    if(tm.students.some(st=>st.name===name)){ toast(`${name} 已經在名單上了`); return; }
    tm.students.push({id:'s'+Date.now().toString(36), name, pkg:el.p.value, fee:Math.max(0, Math.round(Number(el.f.value)||0)), paid:el.d.value || TODAY, from:el.s.value || tm.dates[0]});
    saveSelfrun(); render(); toast(`已新增 ${name}`); return;
  }
  if(f.classList.contains('srnew')){
    const el = f.elements, n = Math.max(1, Math.min(30, Math.round(Number(el.n.value)||0)));
    const dates = []; const x = new Date(el.first.value+'T00:00:00');
    for(let i=0;i<n;i++){ dates.push(ymd(x)); x.setDate(x.getDate()+7); }
    const clash = dates.find(d=>termOf(d)); if(clash){ toast(`${md(clash)} 已經是${termOf(clash).name}的日期，請換第一堂日期`); return; }
    const last = selfrun.terms[selfrun.terms.length-1];
    const num = k => Math.max(0, Math.round(Number(el[k].value)||0));
    const tm = {id:'t'+Date.now().toString(36), name:el.name.value.trim() || '新的一期', dates, price:{one:num('one'), both:num('both')}, single:num('single'), venue:num('venue'), students:[]};
    if(el.copy && el.copy.checked && last) tm.students = last.students.map((st,i)=>({id:'s'+Date.now().toString(36)+i, name:st.name, pkg:st.pkg, fee:pkgPrice(st.pkg, tm), paid:'', from:dates[0]}));
    selfrun.terms.push(tm); srTermId = tm.id; srNewOpen = false; srOpen = null;
    saveSelfrun(); render(); toast(`已建立${tm.name}：${md(dates[0])} 起 ${n} 堂`); return;
  }
  if(f.classList.contains('srdate')){
    const tm = (selfrun.terms||[]).find(x=>x.id===srShown); if(!tm) return;
    const d = f.elements.d.value; if(!d) return;
    if(tm.dates.includes(d)){ toast('這天已經在日期裡了'); return; }
    const other = termOf(d); if(other){ toast(`這天已經是${other.name}的日期`); return; }
    const first = tm.dates.slice().sort()[0];
    if(first && d < first) tm.students.forEach(st=>{ if(!st.from || st.from===first) st.from = d; });   // new first date: students who started at the beginning start here
    tm.dates = [...tm.dates, d].sort(); saveSelfrun(); render(); toast(`已加入 ${md(d)}，每堂學費分攤已重算`); return;
  }
  if(!f.classList.contains('addform')) return;
  const v = id => document.getElementById(id).value.trim();
  month.extras.push({id:'x'+Date.now().toString(36), date:f.dataset.date, time:v('ax-time'), dur:Math.round(Number(v('ax-dur'))||60),
    content:v('ax-content'), place:v('ax-place'), kind:'', pay:Math.round(Number(v('ax-pay'))||0), s:'held'});
  addOpenFor=null; saveMonth(); render(); toast('已加入，並標為有開');
});

/* ---------- boot ---------- */
// Bring whatever is stored up to the current schedule version (nothing is built in, so a missing schedule stays empty)
function upgradeStored(){
  const sc = lsGet('config/schedule');
  if(sc && Array.isArray(sc.classes)){
    schedule = sc.classes;
    if((sc.v||1) < SCHEDULE_VERSION) lsSet('config/schedule', {classes: schedule, v: SCHEDULE_VERSION});
  } else schedule = [];
}
upgradeStored();
loadPrepaid();
loadSelfrun();
loadBilling();
month = normMonth(lsGet(monthPath()) || emptyMonth());
render(); refreshSaveState();
const closeMenu = () => { $('#moreMenu').open = false; };
$('#exportBtn').onclick = () => { closeMenu(); exportBackup(); };
$('#importBtn').onclick = () => { closeMenu(); $('#importFile').click(); };
$('#importFile').onchange = e=>{ const f=e.target.files[0]; if(f) importBackup(f); e.target.value=''; };
$('#driveBtn').onclick = () => {
  if(drive.connected && tokenValid() && drive.error){ drive.error = null; pushNow(); return; }
  drive.lastAutoAsk = Date.now(); askAuth(null, drive.connected);
};
$('#driveRestoreBtn').onclick = () => { closeMenu(); restoreFromDrive(); };
$('#driveFolderBtn').onclick = () => { closeMenu(); if(drive.folderId) window.open('https://drive.google.com/drive/folders/'+drive.folderId, '_blank', 'noopener'); };
$('#syncNowBtn').onclick = () => manualSync();
$('#driveOffBtn').onclick = () => { closeMenu(); disconnectDrive(); };
document.addEventListener('click', e => { if(!e.target.closest('#moreMenu')) closeMenu(); });
// When the 1-hour Google sign-in has lapsed, a tap that changes a record quietly renews it
document.addEventListener('click', e => {
  if(!DRIVE_ON || !drive.connected || !(drive.dirty || drive.needCheck) || tokenValid() || !drive.client) return;
  if(e.target.closest('#driveBtn,#moreMenu,#syncNowBtn')) return;
  if(Date.now() - drive.lastAutoAsk < 5*60*1000) return;
  drive.lastAutoAsk = Date.now();
  askAuth(null, true);
});
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='hidden'){ if(drive.dirty && tokenValid() && !drive.conflict) pushNow(); }
  else if(Date.now() - drive.lastCheck > 15000) syncCheck();   // back to this app: look for another device's changes
});
window.addEventListener('focus', () => { if(Date.now() - drive.lastCheck > 15000) syncCheck(); });
$('#useRemote').onclick = () => { const c = drive.conflict; if(!c) return; drive.conflict = null; pullRemote(c.remote, c.meta); renderConflict(); refreshSaveState(); toast('已改用雲端硬碟的資料'); };
$('#useLocal').onclick = () => { if(!drive.conflict) return; drive.conflict = null; drive.forcePush = true; drive.dirty = true; renderConflict(); pushNow(); toast('已用這台的資料覆蓋雲端硬碟'); };
window.addEventListener('online', () => { drive.offline = false; if(drive.dirty) pushNow(); else refreshSaveState(); });
// Floating "back to top" button, shown once the page has scrolled well past the header
const toTop = $('#toTop');
const syncToTop = () => { const on = window.scrollY > 600; toTop.classList.toggle('show', on); toTop.tabIndex = on ? 0 : -1; };
window.addEventListener('scroll', syncToTop, {passive:true});
toTop.onclick = () => {
  const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({top:0, behavior: smooth ? 'smooth' : 'auto'});
};
syncToTop();
initGoogle();
refreshSaveState();
if(drive.connected){ if(tokenValid()) syncCheck(); else { drive.needCheck = true; refreshSaveState(); } }
setInterval(refreshSaveState, 60*1000);
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
})();
</script>
